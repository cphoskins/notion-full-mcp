[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notion-full-mcp"
version = "0.1.0"
description = "Full-featured Notion MCP server with deep page reading, surgical editing, snapshot/restore, and all block types"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Cauldra", email = "dev@cauldra.ai" },
]
keywords = ["notion", "mcp", "model-context-protocol", "ai", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "fastmcp >= 2.0.0",
    "httpx",
]

[project.urls]
Homepage = "https://github.com/cphoskins/notion-full-mcp"
Repository = "https://github.com/cphoskins/notion-full-mcp"
Issues = "https://github.com/cphoskins/notion-full-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["notion_mcp"]

[project.scripts]
notion-mcp = "notion_mcp.server:main"
